name: Go Build + Tests

# On push to main
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Set permissions
permissions:
  contents: read

# Define jobs for checkout and tests
jobs:
  build:
    runs-on: ubuntu-latest

    # Steps test > build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build all commands
        run: go build ./...